<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FitLog – Dziennik Treningowy</title>
<meta name="theme-color" content="#101012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<style>
:root{
  --bg:#101012; --card:#1c1c1f; --card2:#232327; --border:#2c2c31;
  --text:#f5f5f7; --sub:#9a9aa2; --accent:#a3e635; --accent-dim:#3f4a1f;
  --danger:#ef4444; --warn:#f59e0b;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
button,input,select{font-family:inherit;color:inherit}
input,select{background:var(--card2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);padding:9px 10px;font-size:15px;}
input:focus,select:focus{outline:1px solid var(--accent)}
button{cursor:pointer}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;}
.btn:active{opacity:.7}
.btn:disabled{opacity:.3}
.btn-accent{background:var(--accent);color:#0f1a02;border:none}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-block{width:100%}
.btn-sm{padding:7px 10px;font-size:13px;border-radius:9px}

header.topbar{flex:0 0 auto;background:rgba(16,16,18,.92);
  padding:calc(14px + var(--safe-t)) 16px 10px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border)}
header.topbar h1{font-size:19px;margin:0;font-weight:800}
.icon-btn{background:none;border:none;color:var(--sub);font-size:20px;padding:4px 8px}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px;position:relative}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;background:var(--card2);color:var(--accent);font-size:11px;
  font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
h2.section{font-size:14px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;
  margin:18px 2px 8px}
h2.section:first-child{margin-top:0}
.empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px}

nav.bottomnav{flex:0 0 auto;display:flex;height:var(--nav-h);
  box-sizing:content-box;background:#000000d9;
  border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
nav.bottomnav button{flex:1;background:none;border:none;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:600}
nav.bottomnav button.active{color:var(--accent)}
nav.bottomnav .ic{font-size:20px;line-height:1}

.set-row{display:grid;grid-template-columns:26px 1fr 1fr 56px 42px 42px;gap:8px;align-items:center;
  margin-bottom:8px}
.set-row.no-rir{grid-template-columns:26px 1fr 1fr 42px 42px}
.set-row input{width:100%;text-align:center;padding:8px 4px}
.set-idx{text-align:center;font-weight:700;color:var(--sub);font-size:13px}
.done-toggle{border:1px solid var(--border);background:var(--card2);border-radius:9px;
  height:42px;font-size:19px;color:var(--sub)}
.done-toggle.on{background:var(--accent);color:#0f1a02;border-color:var(--accent)}
.set-del{background:none;border:1px solid var(--danger);border-radius:9px;color:var(--danger);
  font-size:17px;height:42px;width:100%;opacity:.7}
.set-del:active{opacity:1;background:var(--danger);color:#fff}
.set-labels{display:grid;grid-template-columns:26px 1fr 1fr 56px 42px 42px;gap:8px;
  font-size:10px;color:var(--sub);margin-bottom:4px;text-transform:uppercase}
.set-labels.no-rir{grid-template-columns:26px 1fr 1fr 42px 42px}
.set-labels div{text-align:center}

.overlay{position:fixed;inset:0;background:#000000b3;z-index:50;display:flex;
  align-items:flex-end}
.sheet{background:var(--bg);border-radius:18px 18px 0 0;width:100%;max-height:88vh;
  overflow-y:auto;padding:14px 14px calc(18px + var(--safe-b));border-top:1px solid var(--border)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 12px}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:12px}
.picker-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;
  border-bottom:1px solid var(--border)}
.picker-item:last-child{border-bottom:none}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chipbar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card2);border:1px solid var(--border);
  color:var(--sub);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.active{background:var(--accent);color:#0f1a02;border-color:var(--accent)}

.bar-row{margin-bottom:10px}
.bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar-track{background:var(--card2);border-radius:6px;height:10px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:6px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%}

.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.exlist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;
  border-bottom:1px solid var(--border)}
.exlist-item:last-child{border-bottom:none}
.pill-row{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ---------- data: exercise catalogue ---------- */
// Taken from the dataset's own `target` field (19 values, see supabase_exercises.sql) —
// not a made-up split. Order: torso front-to-back, then arms, then legs, then misc.
const MUSCLES = ["Klatka piersiowa","Górna część pleców","Najszersze grzbietu","Czworoboczny grzbietu","Barki","Biceps","Triceps","Przedramiona","Brzuch","Kręgosłup","Czworogłowe uda","Dwugłowe uda","Pośladki","Przywodziciele","Odwodziciele","Łydki","Zębaty przedni","Dźwigacz łopatki","Cardio"];
const EXERCISE_MEDIA_ATTRIBUTION = "© Gym visual — gymvisual.com";
function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function equipmentList(){ return [...new Set(allExercises().map(e=>e.equipment).filter(Boolean))].sort(); }

function slugify(s){
  return "b_"+s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function bid(name){ return slugify(name); }

const TEMPLATES = [
  { name:"Push (Klatka/Barki/Triceps)", ex:["Wyciskanie sztangi na ławce płaskiej","Wyciskanie żołnierskie (OHP)","Rozpiętki z hantlami","Unoszenie hantli bokiem","Wyciskanie francuskie","Pompki na poręczach (dipy)"] },
  { name:"Pull (Plecy/Biceps)", ex:["Martwy ciąg","Podciąganie na drążku","Wiosłowanie sztangą w opadzie","Ściąganie drążka wyciągu górnego (lat pulldown)","Uginanie ramion ze sztangą","Face pull"] },
  { name:"Legs (Nogi)", ex:["Przysiad ze sztangą","Martwy ciąg rumuński","Wykroki z hantlami","Prostowanie nóg na maszynie (leg extension)","Uginanie nóg leżąc (leg curl)","Wspięcia na palce stojąc"] },
  { name:"Upper (Góra ciała)", ex:["Wyciskanie sztangi na ławce płaskiej","Wiosłowanie sztangą w opadzie","Wyciskanie żołnierskie (OHP)","Ściąganie drążka wyciągu górnego (lat pulldown)","Uginanie ramion ze sztangą","Wyciskanie francuskie"] },
  { name:"Lower (Dół ciała)", ex:["Przysiad ze sztangą","Martwy ciąg rumuński","Wyciskanie nóg na suwnicy (leg press)","Uginanie nóg leżąc (leg curl)","Wspięcia na palce stojąc","Hip thrust"] },
].map(t=>({name:t.name, exerciseIds:t.ex.map(bid)}));

/* ---------- backend (Supabase) ---------- */
const SUPABASE_URL = "https://kazerxhglkvzvghysthi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HgepJOMkgDApTjafGI1X3A_meVFWIut";
let sb = null;
let currentUser = null;
let CACHE = { profile:null, exercises:[], routines:[], workouts:[] };

const STORAGE_OK = (()=>{
  try{ const k="__fitlog_test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();

function rowToWorkout(row){
  return { id:row.id, name:row.name, routineId:row.routine_id, entries:row.entries||[], startedAt:row.started_at, endedAt:row.ended_at };
}
function workoutToRow(w){
  return { id:w.id, user_id:currentUser.id, name:w.name, routine_id:w.routineId||null, entries:w.entries, started_at:w.startedAt, ended_at:w.endedAt||null };
}
function showSyncError(msg){ state.syncError = msg; render(); }
function dismissSyncError(){ state.syncError = null; render(); }
function dbWrite(promise, context){
  Promise.resolve(promise).then(res=>{
    if(res && res.error) showSyncError(`Nie zapisano (${context}): ${res.error.message}`);
  }).catch(err=>{
    showSyncError(`Nie zapisano (${context}): ${err.message}`);
  });
}
async function syncTable(table, oldList, newList, toRow, context){
  const oldIds = new Set(oldList.map(x=>x.id));
  const newIds = new Set(newList.map(x=>x.id));
  const removed = oldList.filter(x=>!newIds.has(x.id)).map(x=>x.id);
  if(removed.length) dbWrite(sb.from(table).delete().in("id", removed), context);
  if(newList.length) dbWrite(sb.from(table).upsert(newList.map(toRow)), context);
}

function customExercises(){ return CACHE.exercises.filter(e=>e.custom); }
function saveCustomExercises(list){
  const oldCustom = customExercises();
  const builtIn = CACHE.exercises.filter(e=>!e.custom);
  CACHE.exercises = [...builtIn, ...list];
  syncTable("exercises", oldCustom, list, e=>({
    id: e.id,
    name: e.name,
    muscle: e.muscle,
    muscles: e.muscles || (e.muscle ? [e.muscle] : []),
    created_by: currentUser.id
  }), "baza ćwiczeń");
}
function allExercises(){ return CACHE.exercises; }
function findExercise(id){ return CACHE.exercises.find(e=>e.id===id); }
function exerciseMuscleTags(ex, limit){
  if(!ex) return "";
  let list = (ex.muscles && ex.muscles.length)? ex.muscles : (ex.muscle? [ex.muscle] : []);
  const extra = limit && list.length>limit ? list.length-limit : 0;
  if(limit) list = list.slice(0,limit);
  return list.map(m=>`<span class="tag">${esc(m)}</span>`).join(" ") + (extra? ` <span class="tag">+${extra}</span>` : "");
}
// Fixed-size thumbnail slot so rows line up whether or not an exercise has a
// dataset photo (built-ins/custom exercises never do) — no image means a same-size
// placeholder, never a missing slot that shifts the name text left.
function exerciseThumb(ex, size, styleExtra, attrsExtra){
  const style = `width:${size}px;height:${size}px;border-radius:${Math.round(size*0.22)}px;flex:0 0 auto;${styleExtra||""}`;
  if(ex && ex.imageUrl) return `<img src="${esc(ex.imageUrl)}" loading="lazy" alt="" style="${style}object-fit:cover" ${attrsExtra||""}>`;
  return `<div style="${style}background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.45)}px" ${attrsExtra||""}>🏋️</div>`;
}

function routines(){ return CACHE.routines; }
function saveRoutines(list){
  const old = CACHE.routines;
  CACHE.routines = list;
  syncTable("routines", old, list, r=>({id:r.id, user_id:currentUser.id, name:r.name, exercise_ids:r.exerciseIds}), "plan");
}
function history(){ return CACHE.workouts.filter(w=>w.endedAt); }
function saveHistory(list){
  const oldFinished = CACHE.workouts.filter(w=>w.endedAt);
  const active = CACHE.workouts.filter(w=>!w.endedAt);
  CACHE.workouts = [...list, ...active];
  syncTable("workouts", oldFinished, list, workoutToRow, "historia treningów");
}
function getActive(){ return CACHE.workouts.find(w=>!w.endedAt) || null; }
function saveActive(w){
  if(!w) return;
  const idx = CACHE.workouts.findIndex(x=>x.id===w.id);
  if(idx>=0) CACHE.workouts[idx]=w; else CACHE.workouts.push(w);
  dbWrite(sb.from("workouts").upsert(workoutToRow(w)), "trening");
}
function getUnit(){ return CACHE.profile? CACHE.profile.unit : "kg"; }
function setUnit(u){
  CACHE.profile.unit=u;
  dbWrite(sb.from("profiles").upsert({id:currentUser.id, unit:u, track_rir:CACHE.profile.track_rir}), "ustawienia");
}
function getTrackRir(){ return CACHE.profile? CACHE.profile.track_rir : true; }
function setTrackRir(v){
  CACHE.profile.track_rir=v;
  dbWrite(sb.from("profiles").upsert({id:currentUser.id, unit:CACHE.profile.unit, track_rir:v}), "ustawienia");
}

// PostgREST caps a plain .select() at 1000 rows (db-max-rows) — the exercise
// catalogue (1300+ rows) needs paging past that, unlike the per-user tables below.
async function fetchAllExercises(){
  const PAGE = 1000;
  let all = [], from = 0;
  while(true){
    const res = await sb.from("exercises").select("*").range(from, from+PAGE-1);
    if(res.error) return res;
    all = all.concat(res.data);
    if(res.data.length < PAGE) return {data: all, error: null};
    from += PAGE;
  }
}
async function loadAllData(){
  const uid = currentUser.id;
  try{
    const [profileRes, exercisesRes, routinesRes, workoutsRes] = await Promise.all([
      sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
      fetchAllExercises(),
      sb.from("routines").select("*").eq("user_id",uid),
      sb.from("workouts").select("*").eq("user_id",uid),
    ]);
    const firstError = [profileRes, exercisesRes, routinesRes, workoutsRes].map(r=>r.error).find(Boolean);
    if(firstError) throw firstError;
    CACHE.profile = profileRes.data || {unit:"kg", track_rir:true};
    CACHE.exercises = (exercisesRes.data||[]).map(e=>({
      id: e.id,
      name: e.name,
      muscle: e.muscle || (Array.isArray(e.muscles) && e.muscles.length ? e.muscles[0] : ""),
      muscles: Array.isArray(e.muscles) ? e.muscles : (e.muscle ? [e.muscle] : []),
      custom: !!e.created_by,
      createdBy: e.created_by,
      bodyPart: e.body_part || "",
      equipment: e.equipment || "",
      target: e.target || "",
      secondaryMuscles: e.secondary_muscles || [],
      imageUrl: e.image_url || "",
      gifUrl: e.gif_url || "",
      // ponytail: only the Polish instructions are stored/shown for now — see the
      // "Extra columns" comment in supabase_exercises.sql for how to add a language switcher.
      instructionsPl: e.instructions_pl || "",
    }));
    CACHE.routines = (routinesRes.data||[]).map(r=>({id:r.id, name:r.name, exerciseIds:r.exercise_ids||[]}));
    CACHE.workouts = (workoutsRes.data||[]).map(rowToWorkout);
    const active = getActive();
    if(active){ state.workout = active; state.workout.mode="live"; }
    state.authLoading = false;
    state.syncError = null;
    render();
    if(state.workout && state.workout.mode==="live") startTimer();
  }catch(err){
    state.authLoading = false;
    showSyncError("Nie udało się wczytać danych: "+err.message+" — spróbuj ponownie.");
  }
}
function signInWithGoogle(){
  sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: window.location.origin + window.location.pathname } });
}
function signOut(){ sb.auth.signOut(); }

/* ---------- helpers ---------- */
function plCount(n){
  if(n===1) return "1 ćwiczenie";
  const mod10=n%10, mod100=n%100;
  if(mod10>=2 && mod10<=4 && !(mod100>=12 && mod100<=14)) return n+" ćwiczenia";
  return n+" ćwiczeń";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return crypto.randomUUID(); }
function kgToLb(kg){ return kg*2.20462; }
function lbToKg(lb){ return lb/2.20462; }
function convWeight(kg){ return getUnit()==="lb"? kgToLb(kg): kg; }
function fmtWeight(kg){
  if(kg==null||isNaN(kg)) return "";
  return (Math.round(convWeight(kg)*10)/10).toString();
}
function toKg(inputVal){
  const n = parseFloat(String(inputVal).replace(",", ".")); if(isNaN(n)) return 0;
  return getUnit()==="lb"? lbToKg(n): n;
}
function unitLabel(){ return getUnit(); }
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+
    d.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
}
function fmtDuration(ms){
  const s=Math.floor(ms/1000); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=s%60;
  return h>0? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
}
function workoutVolume(w){
  let v=0;
  for(const entry of w.entries) for(const s of entry.sets) if(!s.warmup && s.done && s.weight>0 && s.reps>0) v += s.weight*s.reps;
  return v;
}
function estOneRM(weight,reps){ return weight*(1+reps/30); }

/* ---------- state ---------- */
const state = {
  tab: "trening",
  workout: null,      // {mode:'live'|'history', id, startedAt, endedAt, name, entries:[]}
  editingRoutine: null,
  picker: null,        // {onPick, query, muscle}
  exerciseSearch: "",
  exerciseMuscleFilter: "Wszystkie",
  exerciseEquipmentFilter: "Wszystkie",
  statsPeriod: 30,
  exerciseDetail: null,
  quickAdd: null,       // {mode:'workout'|'routine', query} inside picker
  settingsOpen: false,
  confirmDialog: null,  // {message, onYes}
  templatesOpen: false,
  authLoading: true,
  syncError: null,
};

function render(){
  const prevMain = document.querySelector("main");
  const keepScroll = (state.workout || state.editingRoutine) && prevMain;
  const scrollTop = keepScroll? prevMain.scrollTop : 0;
  const active = document.activeElement;
  const focusInfo = (active && active.id && document.getElementById("app").contains(active))
    ? {id: active.id, start: active.selectionStart, end: active.selectionEnd} : null;
  document.getElementById("app").innerHTML = App();
  const newMain = document.querySelector("main");
  if(newMain) newMain.scrollTop = scrollTop;
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){ el.focus(); if(el.setSelectionRange) try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){} }
  }
  afterRender();
}

/* ---------- root ---------- */
function App(){
  if(!STORAGE_OK) return StorageWarning();
  if(state.authLoading) return LoadingScreen();
  if(!currentUser) return LoginScreen();
  if(!CACHE.profile) return LoadFailedScreen();
  return `
    ${state.syncError? SyncErrorBanner(): ""}
    ${TopBar()}
    <main>${TabContent()}</main>
    ${BottomNav()}
    ${state.picker? ExercisePickerSheet(): ""}
    ${state.exerciseDetail? ExerciseDetailSheet(): ""}
    ${state.settingsOpen? SettingsSheet(): ""}
    ${state.exerciseForm? ExerciseFormSheet(): ""}
    ${state.confirmDialog? ConfirmDialogSheet(): ""}
  `;
}

function LoadingScreen(){
  return `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub)">Wczytywanie…</div>`;
}
function LoginScreen(){
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center">
    <div style="font-size:48px;margin-bottom:12px">🏋️</div>
    <h1 style="font-size:24px;margin-bottom:6px">FitLog</h1>
    <p class="muted" style="margin-bottom:28px">Zaloguj się, żeby zapisywać swoje treningi.</p>
    <button class="btn btn-accent" style="padding:13px 28px" onclick="signInWithGoogle()">Zaloguj się przez Google</button>
  </div>`;
}
function LoadFailedScreen(){
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center">
    <div style="font-size:40px;margin-bottom:12px">⚠️</div>
    <p class="muted" style="margin-bottom:20px">${esc(state.syncError || "Nie udało się wczytać danych.")}</p>
    <button class="btn btn-accent" onclick="state.syncError=null; state.authLoading=true; render(); loadAllData();">Spróbuj ponownie</button>
  </div>`;
}
function SyncErrorBanner(){
  return `<div style="flex:0 0 auto;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px;
    display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span>⚠️ ${esc(state.syncError)}</span>
    <button onclick="dismissSyncError()" style="background:none;border:none;color:#fff;font-weight:700;font-size:16px;flex:0 0 auto">✕</button>
  </div>`;
}

function StorageWarning(){

function startWorkout(routineId){
  let entries = [];
  let name = "Trening dowolny";
  let rid = null;
  if(routineId){
    const r = routines().find(x=>x.id===routineId);
    if(r){ name = r.name; entries = r.exerciseIds.map(id=>({exerciseId:id, sets:[emptySet()]})); rid = r.id; }
  }
  state.workout = { mode:"live", id:uid(), name, startedAt:new Date().toISOString(), entries, routineId:rid };
  saveActive(state.workout);
  render();
  startTimer();
}
function emptySet(){ return {weight:null, reps:null, rir:null, warmup:false, done:false}; }

function openHistoryWorkout(id){

/* ---------- WORKOUT EDITOR (live + history edit share this) ---------- */
let timerInterval=null;
function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!state.workout || state.workout.mode!=="live") { clearInterval(timerInterval); return; }
    const el = document.getElementById("live-timer");
    if(el) el.textContent = fmtDuration(Date.now()-new Date(state.workout.startedAt).getTime());
  },1000);
}

function WorkoutEditor(){
  const w = state.workout;
  const isLive = w.mode==="live";
  return `

      <input value="${esc(w.name)}" oninput="state.workout.name=this.value; persistWorkout(false);" style="font-weight:800;font-size:16px;border:none;background:none;padding:0;width:100%;margin-bottom:2px">

function ExerciseBlock(entry,ei,total){
  const ex = findExercise(entry.exerciseId);
  const lastSets = lastWorkSets(entry.exerciseId);
  const hint = lastPerformanceText(entry.exerciseId);
  return `
  <div class="card">
    <div class="card-row" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px">
        ${ex? exerciseThumb(ex,40,"cursor:pointer;",`onclick="openExerciseDetail('${ex.id}')"`) : ""}
        <div>
          <b>${esc(ex? ex.name : "Nieznane ćwiczenie")}</b>
        </div>
      </div>
      <div class="pill-row">
        <button class="btn-sm btn-ghost btn" ${ei===0?"disabled":""} onclick="moveExercise(${ei},-1)">↑</button>
        <button class="btn-sm btn-ghost btn" ${ei===total-1?"disabled":""} onclick="moveExercise(${ei},1)">↓</button>
        <button class="btn-sm btn-ghost btn" onclick="removeExercise(${ei})">Usuń</button>
      </div>
    </div>
    <div class="muted" style="margin-bottom:8px;font-size:12px">Poprzednio: ${hint}</div>
    <div class="set-labels ${getTrackRir()?'':'no-rir'}"><div>#</div><div>${unitLabel()}</div><div>Powt.</div>${getTrackRir()?'<div>RIR</div>':''}<div></div><div>✓</div></div>
    ${entry.sets.map((s,si)=>SetRow(ei,si,s,lastSets)).join("")}
    <button class="btn btn-sm btn-ghost btn-block" onclick="addSet(${ei})">+ Dodaj serię</button>
  </div>`;
}

function SetRow(ei,si,s,lastSets){
  const ghost = lastSets[si];
  const gWeight = ghost? fmtWeight(ghost.weight) : "0";
  const gReps = ghost? ghost.reps : "0";
  const gRir = ghost && ghost.rir!=null? ghost.rir : "-";
  const trackRir = getTrackRir();
  return `
  <div class="set-row ${trackRir?'':'no-rir'}">
    <div class="set-idx">${si+1}</div>
    <div>
      <input type="text" inputmode="decimal" placeholder="${gWeight}" value="${fmtWeight(s.weight)}"
        oninput="updateSet(${ei},${si},'weight',this.value)">
    </div>
    <input type="number" inputmode="numeric" placeholder="${gReps}" value="${s.reps??''}"
      oninput="updateSet(${ei},${si},'reps',this.value)">
    ${trackRir? `<input type="number" inputmode="numeric" min="0" max="10" placeholder="${gRir}" value="${s.rir??''}"
      oninput="updateSet(${ei},${si},'rir',this.value)">` : ""}
    <button class="set-del" onclick="removeSet(${ei},${si})" title="Usuń serię">✕</button>
    <button class="done-toggle ${s.done?'on':''}" onclick="toggleDone(${ei},${si})" title="Oznacz jako wykonaną">✓</button>
  </div>`;
}

function persistWorkout(doRender){
  if(state.workout.mode==="live") saveActive(state.workout);
  if(doRender) render();
}
function updateSet(ei,si,field,val){
  const s = state.workout.entries[ei].sets[si];
  if(field==="weight") s.weight = val===""? null : toKg(val);
  else if(field==="reps") s.reps = val===""? null : parseInt(val,10);
  else if(field==="rir") s.rir = val===""? null : parseInt(val,10);
  persistWorkout(false);
}
function toggleDone(ei,si){
  const entry = state.workout.entries[ei];
  const s = entry.sets[si];
  s.done = !s.done;
  if(s.done){
    const ghost = lastWorkSets(entry.exerciseId)[si];
    if(ghost){
      if(s.weight==null) s.weight = ghost.weight;
      if(s.reps==null) s.reps = ghost.reps;
      if(s.rir==null && ghost.rir!=null) s.rir = ghost.rir;
    }
  }
  persistWorkout(true);
}
function addSet(ei){
  const entry = state.workout.entries[ei];
  const last = entry.sets[entry.sets.length-1];
  entry.sets.push(last? {weight:last.weight,reps:last.reps,rir:null,warmup:false,done:false} : emptySet());
  persistWorkout(true);
}
function removeSet(ei,si){
  state.workout.entries[ei].sets.splice(si,1);
  persistWorkout(true);
}
function removeExercise(ei){
  state.workout.entries.splice(ei,1);
  persistWorkout(true);
}
function moveExercise(ei,dir){
  const list = state.workout.entries;
  const target = ei+dir;
  if(target<0 || target>=list.length) return;
  [list[ei],list[target]] = [list[target],list[ei]];
  persistWorkout(true);
}

function openPickerForWorkout(){
  state.picker = { target:"workout", query:"", muscle:"Wszystkie", equipment:"Wszystkie" };
  render();
}
function cancelWorkout(){
  askConfirm("Anulować trening? Postęp zostanie utracony.", ()=>{
    const w = state.workout;
    CACHE.workouts = CACHE.workouts.filter(x=>x.id!==w.id);
    dbWrite(sb.from("workouts").delete().eq("id",w.id), "trening");
    state.workout=null; clearInterval(timerInterval); render();
  });
}
function finishWorkout(){
  const w = state.workout;
  const hasSets = w.entries.some(e=>e.sets.some(s=>s.weight>0 || s.reps>0));
  const proceed = ()=>{
    maybeUpdateRoutineFromWorkout(w, ()=>{
      w.endedAt = new Date().toISOString();
      saveActive(w);
      state.workout=null; clearInterval(timerInterval);
      render();
    });
  };
  if(hasSets) proceed();
  else askConfirm("Trening nie ma zapisanych serii. Zakończyć mimo to?", proceed);
}
function closeWorkoutEditor(){ state.workout=null; render(); }
function saveHistoryWorkout(){
  maybeUpdateRoutineFromWorkout(state.workout, ()=>{
    const list = history();
    const idx = list.findIndex(x=>x.id===state.workout.id);
    const copy = JSON.parse(JSON.stringify(state.workout)); delete copy.mode;
    if(idx>=0) list[idx]=copy; else list.push(copy);
    saveHistory(list);
    state.workout=null; render();
  });
}
function maybeUpdateRoutineFromWorkout(w, onDone){
  if(!w.routineId) return onDone();
  const list = routines();
  const r = list.find(x=>x.id===w.routineId);
  if(!r) return onDone();
  const currentIds = w.entries.map(e=>e.exerciseId);
  const same = currentIds.length===r.exerciseIds.length && currentIds.every((id,i)=>id===r.exerciseIds[i]);
  if(same) return onDone();
  askConfirm(`Zmieniłeś ćwiczenia względem planu „${r.name}”. Zaktualizować plan o te zmiany?`, ()=>{
    r.exerciseIds = currentIds;
    saveRoutines(list);
    onDone();
  }, onDone);
}
function deleteHistoryWorkout(){
  askConfirm("Usunąć ten trening z historii?", ()=>{
    saveHistory(history().filter(x=>x.id!==state.workout.id));
    state.workout=null; render();
  });
}

function lastWorkSets(exerciseId){
  const hist = history().slice().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
  for(const w of hist){
    if(state.workout && w.id===state.workout.id) continue;
    const entry = w.entries.find(e=>e.exerciseId===exerciseId);
    if(entry){
      const done = entry.sets.filter(s=>!s.warmup && s.weight>0 && s.reps>0);
      if(done.length) return done;
    }
  }
  return [];
}
function lastPerformanceText(exerciseId){
  const sets = lastWorkSets(exerciseId);
  if(!sets.length) return "brak historii";
  const showRir = getTrackRir();
  return sets.map(s=>`${fmtWeight(s.weight)}${unitLabel()}×${s.reps}${showRir && s.rir!=null? ` (RIR ${s.rir})`:""}`).join(", ");
}

function pickExercise(exerciseId){

/* ---------- STATYSTYKI TAB ---------- */
function StatystykiTab(){
  const hist = history().slice().sort((a,b)=> new Date(a.startedAt)-new Date(b.startedAt));
  if(hist.length===0) return `<div class="empty">Brak danych. Zapisz swój pierwszy trening, żeby zobaczyć statystyki.</div>`;

  const last10 = hist.slice(-10);
  const maxVol = Math.max(1,...last10.map(workoutVolume));

  const oneRM = {};
  for(const w of hist) for(const entry of w.entries){
    for(const s of entry.sets){
      if(s.warmup || !s.done || !(s.weight>0) || !(s.reps>0)) continue;
      const v = estOneRM(s.weight,s.reps);
      if(!oneRM[entry.exerciseId] || v>oneRM[entry.exerciseId].value) oneRM[entry.exerciseId]={value:v,date:w.startedAt};
    }
  }
  const oneRMList = Object.entries(oneRM).map(([id,d])=>({ex:findExercise(id),...d}))
    .filter(x=>x.ex).sort((a,b)=>b.value-a.value).slice(0,10);

  const period = state.statsPeriod;
  const cutoff = Date.now()-period*86400000;
  const muscleVol = {};
  for(const w of hist){
    if(new Date(w.startedAt).getTime()<cutoff) continue;
    for(const entry of w.entries){
      const ex = findExercise(entry.exerciseId); if(!ex) continue;
      let v=0; for(const s of entry.sets) if(!s.warmup && s.done && s.weight>0 && s.reps>0) v+=s.weight*s.reps;
      const targetMuscles = (ex.muscles && ex.muscles.length) ? ex.muscles : (ex.muscle ? [ex.muscle] : []);
      for(const m of targetMuscles){
        muscleVol[m] = (muscleVol[m]||0)+v;
      }
    }
  }
  const muscleList = Object.entries(muscleVol).sort((a,b)=>b[1]-a[1]);
  const maxMuscle = Math.max(1,...muscleList.map(x=>x[1]));

  return `
    <h2 class="section">Objętość ostatnich treningów</h2>
    <div class="card">
      ${last10.map(w=>`
        <div class="bar-row">
          <div class="bar-label"><span>${new Date(w.startedAt).toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit"})}</span><span>${Math.round(convWeight(workoutVolume(w)))} ${unitLabel()}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${workoutVolume(w)/maxVol*100}%"></div></div>
        </div>`).join("")}
    </div>

    <h2 class="section">Szacowane 1RM (rekordy)</h2>
    <div class="card">
      ${oneRMList.length===0? `<div class="muted">Brak ukończonych serii.</div>` :
        oneRMList.map(o=>`
        <div class="card-row" style="padding:6px 0;border-bottom:1px solid var(--border)">
          <div>${esc(o.ex.name)}<div class="muted">${new Date(o.date).toLocaleDateString("pl-PL")}</div></div>
          <b>${fmtWeight(o.value)} ${unitLabel()}</b>
        </div>`).join("")}
    </div>

    <h2 class="section">Zaangażowanie partii mięśniowych</h2>
    <div class="chipbar">
      ${[7,30,90].map(d=>`<button class="chip ${period===d?'active':''}" onclick="state.statsPeriod=${d}; render();">${d} dni</button>`).join("")}
    </div>
    <div class="card">
      ${muscleList.length===0? `<div class="muted">Brak treningów w tym okresie.</div>` :
        muscleList.map(([m,v])=>`
        <div class="bar-row">
          <div class="bar-label"><span>${esc(m)}</span><span>${Math.round(convWeight(v))} ${unitLabel()}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${v/maxMuscle*100}%"></div></div>
        </div>`).join("")}
    </div>
  `;
}

/* ---------- CWICZENIA TAB ---------- */
function CwiczeniaTab(){
  const q = state.exerciseSearch.trim().toLowerCase();
  const list = allExercises().filter(e=>{
    const mQ = !q || e.name.toLowerCase().includes(q);
    const mM = state.exerciseMuscleFilter==="Wszystkie" || e.muscle===state.exerciseMuscleFilter || (e.muscles && e.muscles.includes(state.exerciseMuscleFilter));
    const mEq = state.exerciseEquipmentFilter==="Wszystkie" || e.equipment===state.exerciseEquipmentFilter;
    return mQ && mM && mEq;
  }).sort((a,b)=>a.name.localeCompare(b.name,"pl"));

  return `
    <input id="exercise-search" placeholder="Szukaj ćwiczenia…" value="${esc(state.exerciseSearch)}" style="width:100%;margin-bottom:10px"
      oninput="state.exerciseSearch=this.value; render();">
    <div class="chipbar">
      ${["Wszystkie",...MUSCLES].map(m=>`
        <button class="chip ${state.exerciseMuscleFilter===m?'active':''}" onclick="state.exerciseMuscleFilter='${m}'; render();">${m}</button>
      `).join("")}
    </div>
    <div class="chipbar">
      ${["Wszystkie",...equipmentList()].map(eq=>`
        <button class="chip ${state.exerciseEquipmentFilter===eq?'active':''}" onclick="state.exerciseEquipmentFilter='${esc(eq)}'; render();">${esc(capitalize(eq))}</button>
      `).join("")}
    </div>
    <div class="card">
      ${list.length===0? `<div class="empty">Brak wyników.</div>` : list.map(e=>`
        <div class="exlist-item" onclick="openExerciseDetail('${e.id}')" style="cursor:pointer">
          ${exerciseThumb(e,36,"margin-right:10px;")}
          <div style="flex:1;min-width:0">${esc(e.name)}<div style="margin-top:2px">${exerciseMuscleTags(e,2)}</div></div>
          ${e.custom && e.createdBy===currentUser?.id? `<button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteCustomExercise('${e.id}')">Usuń</button>` : `<span class="muted">›</span>`}
        </div>`).join("")}
    </div>
    <button class="btn btn-accent btn-block" style="margin-top:12px" onclick="openNewExerciseForm()">+ Dodaj ćwiczenie</button>
  `;
}
function deleteCustomExercise(id){
  askConfirm("Usunąć to ćwiczenie z bazy?", ()=>{
    saveCustomExercises(customExercises().filter(e=>e.id!==id));
    render();
  });
}
function openNewExerciseForm(){
  state.exerciseForm = { name:"", muscles:[MUSCLES[0]], context:"library" };
  render();
}
function quickAddExercise(name){
  state.exerciseForm = { name, muscles:[MUSCLES[0]], context:"picker" };
  render();
}
function toggleExerciseFormMuscle(m){
  const f = state.exerciseForm;
  if(!f.muscles) f.muscles = [f.muscle || MUSCLES[0]];
  const idx = f.muscles.indexOf(m);
  if(idx>=0){
    if(f.muscles.length>1) f.muscles.splice(idx,1);
  } else {
    f.muscles.push(m);
  }
  render();
}
function ExerciseFormSheet(){
  const f = state.exerciseForm;
  const selectedMuscles = f.muscles && f.muscles.length ? f.muscles : (f.muscle ? [f.muscle] : [MUSCLES[0]]);
  return `<div class="overlay" onclick="if(event.target===this) closeExerciseForm()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Nowe ćwiczenie</div>
      <div class="field">
        <label>Nazwa</label>
        <input value="${esc(f.name)}" oninput="state.exerciseForm.name=this.value" autofocus>
      </div>
      <div class="field">
        <label>Partie mięśniowe (wybierz jedną lub kilka)</label>
        <div class="chipbar" style="flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto;padding:4px 0">
          ${MUSCLES.map(m=>{
            const active = selectedMuscles.includes(m);
            return `<button type="button" class="chip ${active?'active':''}" onclick="toggleExerciseFormMuscle('${esc(m)}')">${esc(m)}</button>`;
          }).join("")}
        </div>
      </div>
      <div class="pill-row" style="margin-top:14px">
        <button class="btn btn-ghost" style="flex:1" onclick="closeExerciseForm()">Anuluj</button>
        <button class="btn btn-accent" style="flex:1" onclick="saveExerciseForm()">Zapisz</button>
      </div>
    </div>
  </div>`;
}
function closeExerciseForm(){ state.exerciseForm=null; render(); }
function saveExerciseForm(){
  const f = state.exerciseForm;
  if(!f.name.trim()) return;
  const selectedMuscles = f.muscles && f.muscles.length ? f.muscles : (f.muscle ? [f.muscle] : [MUSCLES[0]]);
  const ex = {
    id: uid(),
    name: f.name.trim(),
    muscle: selectedMuscles[0],
    muscles: selectedMuscles,
    custom: true,
    createdBy: currentUser.id
  };
  const list = customExercises(); list.push(ex); saveCustomExercises(list);
  const ctx = f.context;
  state.exerciseForm = null;
  if(ctx==="picker") pickExercise(ex.id); else render();
}
function openExerciseDetail(id){ state.exerciseDetail = id; render(); }
function ExerciseDetailSheet(){
  const ex = findExercise(state.exerciseDetail);
  if(!ex){ state.exerciseDetail=null; return ""; }
  const hist = history().slice().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
  const sessions = [];
  for(const w of hist){
    const entry = w.entries.find(e=>e.exerciseId===ex.id);
    if(entry){
      const done = entry.sets.filter(s=>!s.warmup && s.weight>0 && s.reps>0);
      if(done.length) sessions.push({date:w.startedAt, text:done.map(s=>`${fmtWeight(s.weight)}${unitLabel()}×${s.reps}`).join(", ")});
    }
    if(sessions.length>=5) break;
  }
  let best=null;
  for(const w of hist) for(const entry of w.entries){
    if(entry.exerciseId!==ex.id) continue;
    for(const s of entry.sets){
      if(s.warmup || !s.done || !(s.weight>0) || !(s.reps>0)) continue;
      const v = estOneRM(s.weight,s.reps);
      if(!best || v>best) best=v;
    }
  }
  return `<div class="overlay" onclick="if(event.target===this){state.exerciseDetail=null; render();}">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${esc(ex.name)}</div>
      ${ex.gifUrl? `
        <img src="${esc(ex.gifUrl)}" alt="${esc(ex.name)}" style="width:100%;max-width:260px;display:block;margin:0 auto 10px;border-radius:12px;background:var(--card2)">
        <div class="muted" style="text-align:center;font-size:11px;margin-bottom:12px">${EXERCISE_MEDIA_ATTRIBUTION}</div>
      ` : ""}
      <div style="margin-bottom:12px">
        ${exerciseMuscleTags(ex)}
        ${ex.equipment? `<span class="tag">${esc(capitalize(ex.equipment))}</span>` : ""}
      </div>
      ${ex.instructionsPl? `
        <h2 class="section">Jak wykonać</h2>
        <div class="card" style="white-space:pre-line">${esc(ex.instructionsPl)}</div>
      ` : ""}
      <h2 class="section">Rekord (szac. 1RM)</h2>
      <div class="card">${best? `<b>${fmtWeight(best)} ${unitLabel()}</b>` : `<span class="muted">Brak danych</span>`}</div>
      <h2 class="section">Ostatnie sesje</h2>
      <div class="card">
        ${sessions.length===0? `<div class="muted">Brak historii.</div>` : sessions.map(s=>`
          <div style="padding:6px 0;border-bottom:1px solid var(--border)">
            <div class="muted">${new Date(s.date).toLocaleDateString("pl-PL")}</div>
            <div>${s.text}</div>
          </div>`).join("")}
      </div>
      <button class="btn btn-ghost btn-block" onclick="state.exerciseDetail=null; render();">Zamknij</button>
    </div>
  </div>`;
}

/* ---------- SETTINGS ---------- */
function askConfirm(message, onYes, onNo){
  state.confirmDialog = {message, onYes, onNo};
  render();
}
function closeConfirmDialog(){
  const cb = state.confirmDialog?.onNo;
  state.confirmDialog=null;
  render();
  if(cb) cb();
}
function confirmDialogYes(){
  const cb = state.confirmDialog.onYes;
  state.confirmDialog = null;
  cb();
}
function ConfirmDialogSheet(){
  const c = state.confirmDialog;
  return `<div class="overlay" onclick="if(event.target===this) closeConfirmDialog()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${esc(c.message)}</div>
      <div class="pill-row">
        <button class="btn btn-ghost" style="flex:1" onclick="closeConfirmDialog()">Nie</button>
        <button class="btn btn-accent" style="flex:1" onclick="confirmDialogYes()">Tak</button>
      </div>
    </div>
  </div>`;
}

function SettingsSheet(){
  const u = getUnit();
  const rir = getTrackRir();
  return `<div class="overlay" onclick="if(event.target===this){state.settingsOpen=false; render();}">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Ustawienia</div>
      <div class="field">
        <label>Jednostka wagi</label>
        <div class="pill-row">
          <button class="btn ${u==='kg'?'btn-accent':'btn-ghost'}" style="flex:1" onclick="setUnit('kg'); render();">kg</button>
          <button class="btn ${u==='lb'?'btn-accent':'btn-ghost'}" style="flex:1" onclick="setUnit('lb'); render();">lb</button>
        </div>
      </div>
      <div class="field">
        <label>Śledzenie RIR (powtórzenia w rezerwie)</label>
        <div class="pill-row">
          <button class="btn ${rir?'btn-accent':'btn-ghost'}" style="flex:1" onclick="setTrackRir(true); render();">Tak</button>
          <button class="btn ${!rir?'btn-accent':'btn-ghost'}" style="flex:1" onclick="setTrackRir(false); render();">Nie</button>
        </div>
      </div>
      <div class="field">
        <label>Konto</label>
        <div class="muted" style="margin-bottom:8px">${esc(currentUser?.email || "")}</div>
        <button class="btn btn-danger btn-block" onclick="state.settingsOpen=false; signOut();">Wyloguj się</button>
      </div>
      <button class="btn btn-ghost btn-block" onclick="state.settingsOpen=false; render();">Zamknij</button>
    </div>
  </div>`;
}

/* ---------- init ---------- */
function afterRender(){}

(function init(){
  if(STORAGE_OK){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((event, sessionObj)=>{
      currentUser = sessionObj? sessionObj.user : null;
      if(currentUser){
        state.authLoading = true;
        render();
        loadAllData();
      } else {
        state.authLoading = false;
        CACHE = { profile:null, exercises:[], routines:[], workouts:[] };
        state.workout = null;
        render();
      }
    });
  }
  render();
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
